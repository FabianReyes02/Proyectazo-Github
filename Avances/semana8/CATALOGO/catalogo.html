<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explorar Juegos Steam</title>
    <link rel="stylesheet" href="estilocatalogo.css" />
</head>
<body>
    <header>
        <nav>
            <a href="#" class="logo-link" aria-label="Inicio">
                <img src="fotos/logo-Photoroom.png" alt="Logo de la aplicación" class="logo-img" />
            </a>
            <input type="text" placeholder="Buscar..." />
            <div class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" role="button" tabindex="0">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <ul id="menu" class="menu">
                <li>Todos</li>
                <li>Disparos</li>
                <li>Supervivencia</li>
                <li>Más</li>
            </ul>
            <div class="user-info">
                <span>Brian Aravena</span>
                <img src="img/furro.jpg" alt="Perfil" />
            </div>
        </nav>
    </header>
    <main>
        <div class="game-grid" id="game-grid">
            <!--Los juegos se agregan aca-->
        </div>
    </main>
    <script src="scriptcatalogo.js"></script>
</body>
</html>
